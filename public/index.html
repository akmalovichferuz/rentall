<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rentall Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #000000; color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #111827; position: relative; overflow-x: hidden; box-shadow: 0 0 20px rgba(0,255,100,0.05); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .rentall-card { border-radius: 16px; background-color: #1f2937; border: 1px solid #374151; transition: all 0.2s ease; }
        .rentall-card:hover { border-color: #22c55e; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(34, 197, 94, 0.1); }
        .cat-btn { background-color: #1f2937; color: #9ca3af; border: 1px solid transparent; }
        .cat-btn.active { background-color: #22c55e; color: #000000; border-color: #22c55e; font-weight: 700; box-shadow: 0 0 10px rgba(34,197,94,0.3); }
        .cat-btn.fav-active { background-color: #ef4444; color: #ffffff; border-color: #ef4444; font-weight: 700; box-shadow: 0 0 10px rgba(239,68,68,0.3); }
        .cat-btn.my-active { background-color: #3b82f6; color: #ffffff; border-color: #3b82f6; font-weight: 700; box-shadow: 0 0 10px rgba(59,130,246,0.3); }
        select option { background-color: #1f2937; color: #fff; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="font-sans antialiased">
    <div class="app-container pb-24 relative">
        <header class="sticky top-0 z-40 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-500 rounded-xl flex justify-center items-center shadow-[0_0_15px_rgba(34,197,94,0.4)]">
                    <i class="fa-solid fa-box-open text-black text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-white tracking-tight leading-none">Rentall</h1>
                    <p class="text-[10px] text-green-400 font-medium uppercase tracking-wider">Ijara platformasi</p>
                </div>
            </div>
            <div class="flex items-center bg-gray-800 px-3 py-1.5 rounded-xl border border-gray-700 shadow-sm">
                <i class="fa-solid fa-coins text-green-500 mr-2 text-sm"></i>
                <span id="user-coins" class="font-black text-white text-sm">0</span>
            </div>
        </header>

        <section class="px-5 py-4 border-b border-gray-800">
            <div class="relative group">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400 group-focus-within:text-green-500 transition-colors"></i>
                <input type="text" id="searchInput" placeholder="Nima ijaraga olmoqchisiz?" class="w-full bg-gray-800 border border-gray-700 rounded-2xl py-3 pl-11 pr-4 outline-none focus:bg-gray-800 focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all text-sm font-medium text-white placeholder-gray-500">
            </div>
            <div class="flex gap-3 mt-3">
                <div class="relative w-1/2">
                    <i class="fa-solid fa-location-dot absolute left-3 top-2.5 text-gray-500 text-sm"></i>
                    <select id="regionFilter" class="w-full bg-gray-800 border border-gray-700 rounded-xl py-2.5 pl-8 pr-2 text-xs font-medium text-gray-300 outline-none focus:border-green-500 appearance-none">
                        <option value="">Barcha hududlar</option>
                    </select>
                </div>
                <div class="relative w-1/2">
                    <i class="fa-solid fa-map absolute left-3 top-2.5 text-gray-500 text-sm"></i>
                    <select id="districtFilter" class="w-full bg-gray-800 border border-gray-700 rounded-xl py-2.5 pl-8 pr-2 text-xs font-medium text-gray-300 outline-none focus:border-green-500 appearance-none">
                        <option value="">Barcha tumanlar</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="px-5 py-4 border-b border-gray-800">
            <div id="categoryContainer" class="flex gap-2.5 overflow-x-auto hide-scroll pb-2"></div>
        </section>

        <main class="px-5 py-4 min-h-[50vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-white">E'lonlar ro'yxati</h2>
                <span class="text-[10px] text-gray-400 font-medium" id="itemsCount">0 ta tovar</span>
            </div>
            <div id="itemsGrid" class="grid grid-cols-2 gap-4"></div>
        </main>

        <div class="fixed bottom-6 left-0 right-0 max-w-[480px] mx-auto pointer-events-none z-30">
            <button id="addBtn" class="absolute bottom-0 right-6 w-14 h-14 bg-green-500 text-black rounded-full shadow-[0_0_20px_rgba(34,197,94,0.5)] flex justify-center items-center text-2xl hover:scale-105 transition-transform pointer-events-auto">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <!-- ========================================== -->
        <!-- YARATISH MODALI (YASHIL)                   -->
        <!-- ========================================== -->
        <div id="addModal" class="fixed top-0 bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-gray-900 z-50 hidden flex-col overflow-y-auto animate-[slideUp_0.2s_ease-out]">
            <div class="p-6 flex flex-col min-h-full">
                <div class="flex justify-between items-center mb-6 pt-2">
                    <h2 class="text-2xl font-bold text-white">Yangi e'lon</h2>
                    <button id="closeModalBtn" class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="bg-green-900/20 border border-green-800 p-4 rounded-2xl mb-6 flex items-start gap-3">
                    <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center flex-shrink-0 text-black"><i class="fa-solid fa-coins text-sm"></i></div>
                    <p class="text-sm text-green-400 font-medium leading-relaxed">
                        E'lon joylash narxi: <b class="text-white"><span id="ui_create_cost">5</span> tanga</b>. 
                        Balansingizdan yechiladi.
                    </p>
                </div>
                <form id="addItemForm" class="space-y-4 pb-10">
                    <div><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Tovar nomi</label><input type="text" id="addTitle" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-green-500 text-white text-sm"></div>
                    <div><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Rasm yuklash</label><input type="file" id="addImage" accept="image/*" required class="w-full bg-gray-800 border border-gray-700 rounded-xl py-3 px-3 outline-none focus:border-green-500 text-white text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:bg-green-500 file:text-black cursor-pointer"></div>
                    <div class="flex gap-4">
                        <div class="w-1/2"><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Narxi (kunlik)</label><input type="number" id="addPrice" required class="w-full bg-gray-800 border border-gray-700 rounded-xl py-3.5 px-3 outline-none focus:border-green-500 text-white text-sm font-bold"></div>
                        <div class="w-1/2"><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Kategoriya</label><select id="addCategory" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-green-500 text-white text-sm appearance-none"></select></div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Manzil</label>
                        <div class="flex gap-3">
                            <select id="addRegion" required class="w-1/2 bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-green-500 text-white text-sm appearance-none"><option value="">Viloyat...</option></select>
                            <select id="addDistrict" required disabled class="w-1/2 bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-green-500 text-white text-sm disabled:opacity-50 appearance-none"><option value="">Avval viloyat</option></select>
                        </div>
                    </div>
                    <div><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Batafsil</label><textarea id="addDesc" required rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-green-500 text-white text-sm resize-none"></textarea></div>
                    <button type="submit" id="submitItemBtn" class="w-full bg-green-500 text-black font-bold py-4 rounded-xl hover:bg-green-400 mt-4">
                        Joylash (-<span id="ui_create_btn">5</span> tanga)
                    </button>
                </form>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- TAHRIRLASH MODALI (KO'K)                   -->
        <!-- ========================================== -->
        <div id="editModal" class="fixed top-0 bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-gray-900 z-50 hidden flex-col overflow-y-auto animate-[slideUp_0.2s_ease-out]">
            <div class="p-6 flex flex-col min-h-full">
                <div class="flex justify-between items-center mb-6 pt-2">
                    <h2 class="text-2xl font-bold text-white">E'lonni tahrirlash</h2>
                    <button id="closeEditModalBtn" class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="bg-blue-900/20 border border-blue-800 p-4 rounded-2xl mb-6 flex items-start gap-3">
                    <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center flex-shrink-0 text-white"><i class="fa-solid fa-pen text-sm"></i></div>
                    <p class="text-sm text-blue-400 font-medium leading-relaxed">
                        Tahrirlash narxi: <b class="text-white"><span id="ui_edit_cost">2</span> tanga</b>. 
                        Balansingizdan yechiladi.
                    </p>
                </div>
                <form id="editItemForm" class="space-y-4 pb-10">
                    <div><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Tovar nomi</label><input type="text" id="editTitle" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-blue-500 text-white text-sm"></div>
                    <div><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Yangi Rasm (ixtiyoriy)</label><input type="file" id="editImage" accept="image/*" class="w-full bg-gray-800 border border-gray-700 rounded-xl py-3 px-3 outline-none focus:border-blue-500 text-white text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:bg-blue-500 file:text-white cursor-pointer"></div>
                    <div class="flex gap-4">
                        <div class="w-1/2"><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Narxi</label><input type="number" id="editPrice" required class="w-full bg-gray-800 border border-gray-700 rounded-xl py-3.5 px-3 outline-none focus:border-blue-500 text-white text-sm font-bold"></div>
                        <div class="w-1/2"><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Kategoriya</label><select id="editCategory" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-blue-500 text-white text-sm appearance-none"></select></div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Manzil</label>
                        <div class="flex gap-3">
                            <select id="editRegion" required class="w-1/2 bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-blue-500 text-white text-sm appearance-none"><option value="">Viloyat...</option></select>
                            <select id="editDistrict" required class="w-1/2 bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-blue-500 text-white text-sm appearance-none"><option value="">Tuman...</option></select>
                        </div>
                    </div>
                    <div><label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase">Batafsil</label><textarea id="editDesc" required rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 outline-none focus:border-blue-500 text-white text-sm resize-none"></textarea></div>
                    <button type="submit" id="submitEditBtn" class="w-full bg-blue-500 text-white font-bold py-4 rounded-xl hover:bg-blue-400 mt-4">
                        Saqlash (-<span id="ui_edit_btn">2</span> tanga)
                    </button>
                </form>
            </div>
        </div>

        <!-- MA'LUMOT KARTASI -->
        <div id="itemDetailsModal" class="fixed top-0 bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-gray-900 z-[60] hidden flex-col animate-[slideUp_0.2s_ease-out] overflow-y-auto">
            <button id="closeDetailsBtn" class="absolute top-4 right-4 z-10 w-11 h-11 bg-black/60 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-black/80 shadow-lg"><i class="fa-solid fa-arrow-down text-lg"></i></button>
            <div class="flex-1 flex flex-col">
                <img id="detailImage" src="" class="w-full h-64 object-cover shadow-lg cursor-pointer hover:opacity-95 flex-shrink-0">
                <div class="p-5 flex-shrink-0">
                    <h2 id="detailTitle" class="text-xl font-bold text-white mb-2 leading-tight"></h2>
                    <div class="flex items-center justify-between">
                        <div class="text-green-400 font-black text-2xl"><span id="detailPrice"></span> so'm <span class="text-sm text-gray-500 font-normal">/kun</span></div>
                        <div id="detailCategory" class="bg-gray-800 text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-gray-700 font-medium"></div>
                    </div>
                </div>
                <div class="flex px-5 border-b border-gray-800 flex-shrink-0">
                    <button id="tabInfoBtn" class="w-1/2 py-3 text-sm font-bold text-green-500 border-b-2 border-green-500 transition-colors">Ma'lumotlar</button>
                    <button id="tabCommentsBtn" class="w-1/2 py-3 text-sm font-bold text-gray-500 border-b-2 border-transparent transition-colors">Fikrlar (<span id="tabCommentsCount">0</span>)</button>
                </div>
                <div class="flex-1 p-5 pb-10">
                    <div id="tabInfoContent" class="block">
                        <div class="bg-gray-800 rounded-2xl p-5 mb-5 border border-gray-700">
                            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1.5 font-bold"><i class="fa-solid fa-location-dot mr-1"></i> Manzil</p>
                            <p id="detailLocation" class="text-base text-white font-medium mb-5"></p>
                            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1.5 font-bold"><i class="fa-solid fa-circle-info mr-1"></i> Batafsil ma'lumot</p>
                            <p id="detailDesc" class="text-sm text-gray-300 leading-relaxed"></p>
                        </div>
                        <div class="bg-green-900/10 rounded-2xl p-5 border border-green-800/40">
                            <p class="text-xs text-green-500 uppercase tracking-widest mb-4 font-bold"><i class="fa-solid fa-address-card mr-1"></i> Ega haqida ma'lumot</p>
                            <div class="flex items-center gap-4 mb-5">
                                <div class="w-14 h-14 bg-gray-800 border border-gray-700 rounded-full flex justify-center items-center text-gray-400 text-2xl"><i class="fa-solid fa-user"></i></div>
                                <div><p class="text-white font-bold text-xl mb-1" id="detailOwnerName"></p><p class="text-green-400 font-medium text-base"><i class="fa-solid fa-phone text-sm mr-1"></i> <span id="detailOwnerPhone"></span></p></div>
                            </div>
                            <button id="detailContactBtn" class="w-full bg-green-500 text-black font-bold text-base py-4 rounded-xl hover:bg-green-400 transition-colors shadow-[0_0_15px_rgba(34,197,94,0.3)] flex items-center justify-center gap-2"><i class="fa-brands fa-telegram text-xl"></i> Telegram orqali bog'lanish</button>
                        </div>
                    </div>
                    <div id="tabCommentsContent" class="hidden flex-col gap-4">
                        <div id="commentsList" class="space-y-3"></div>
                        <form id="addCommentForm" class="relative mt-2">
                            <input type="text" id="commentText" required class="w-full bg-gray-800 border border-gray-700 rounded-xl py-3 pl-4 pr-12 outline-none focus:border-green-500 text-white text-sm" placeholder="Fikr yozing...">
                            <button type="submit" id="submitCommentBtn" class="absolute right-2 top-2 w-8 h-8 mt-0.5 bg-green-500 rounded-lg flex items-center justify-center text-black hover:bg-green-400 transition-colors"><i class="fa-solid fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="fullScreenImageModal" class="fixed inset-0 bg-black z-[100] hidden flex-col justify-center items-center opacity-0 transition-opacity duration-300">
            <button id="closeFullScreenBtn" class="absolute top-6 right-6 w-10 h-10 bg-gray-800/80 rounded-full flex items-center justify-center text-white hover:bg-gray-700"><i class="fa-solid fa-times text-xl"></i></button>
            <img id="fullScreenImage" src="" class="max-w-full max-h-full object-contain p-2">
        </div>
    </div>
    
    <script src="js/social.js"></script>
    <script src="app.js"></script>
</body>
</html>
